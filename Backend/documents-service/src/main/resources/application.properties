spring.application.name=documents-service
server.port=8081
# H2 Database
spring.datasource.url=jdbc:h2:mem:documentsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

comments.service.url=${COMMENTS_SERVICE_URL:http://localhost:8083}

# AWS S3 / MinIO Configuration
aws.s3.endpoint=http://localhost:9000
aws.s3.access-key=admin
aws.s3.secret-key=ensia1234
aws.s3.bucket=documents
aws.s3.region=us-east-1

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB