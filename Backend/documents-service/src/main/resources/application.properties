spring.application.name=documents-service
server.port=8081
# H2 Database
spring.datasource.url=jdbc:h2:mem:documentsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

comments.service.url=${COMMENTS_SERVICE_URL:http://localhost:8083}

# AWS S3 / MinIO Configuration
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.presign-endpoint=${AWS_S3_PRESIGN_ENDPOINT:${aws.s3.endpoint}}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:admin}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:ensia1234}
aws.s3.bucket=${AWS_S3_BUCKET:documents}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.presign-expiration-minutes=${AWS_S3_PRESIGN_EXPIRATION_MINUTES:10}

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Kafka producer settings
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
dms.kafka.topics.documents-uploaded=dms.documents.uploaded

# Kafka consumer settings
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=documents-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
dms.kafka.topics.documents-translated=dms.documents.translated