spring.datasource.url=jdbc:postgresql://${PG_HOST:postgres}:5432/${POSTGRES_DB:documentsdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
comments.service.url=${COMMENTS_SERVICE_URL:http://comments-service:8083}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://minio:9000}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:admin}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:ensia1234}
aws.s3.bucket=${AWS_S3_BUCKET:documents}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.presign-expiration-minutes=${AWS_S3_PRESIGN_EXPIRATION_MINUTES:10}

spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=documents-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
dms.kafka.topics.documents-translated=dms.documents.translated

