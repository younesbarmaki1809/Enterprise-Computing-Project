services:
  frontend:
    build:
      context: ../../Frontend/Frontend
      dockerfile: Dockerfile
    container_name: c3-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: c3-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,srvr"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo ruok | (exec 3<>/dev/tcp/localhost/2181; cat >&3; cat <&3; exec 3<&-)' | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: c3-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: c3-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: c3-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documentsdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: c3-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: c3-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: dms-cluster
      CASSANDRA_DC: datacenter1
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    container_name: c3-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "
        echo 'Creating keyspace dms...';
        cqlsh cassandra 9042 -e \"
          CREATE KEYSPACE IF NOT EXISTS dms
          WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
        \";
        echo 'Keyspace dms created.';
      "

  minio:
    image: quay.io/minio/minio:latest
    container_name: c3-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ensia1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - c3_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    container_name: c3-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 admin ensia1234;
        mc mb myminio/documents --ignore-existing;
        echo 'Bucket documents created.';
      "

  documents:
    build:
      context: ./documents-service
      dockerfile: Dockerfile
    container_name: c3-documents
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      REDIS_HOST: redis
      COMMENTS_SERVICE_URL: http://comments:8083
      AWS_S3_ENABLED: "true"
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: http://localhost:9000
      AWS_S3_ACCESS_KEY: admin
      AWS_S3_SECRET_KEY: ensia1234
      AWS_S3_BUCKET: documents
      AWS_S3_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8086:8081"

  comments:
    build:
      context: ./comments-service
      dockerfile: Dockerfile
    container_name: c3-comments
    environment:
      CASSANDRA_HOST: cassandra
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: c3-gateway
    environment:
      DOCUMENTS_SERVICE_URL: http://documents:8081
      COMMENTS_SERVICE_URL: http://comments:8083
    depends_on:
      - documents
      - comments
    ports:
      - "8085:8080"

  translator-service:
    build:
      context: ./translator-service
      dockerfile: Dockerfile
    container_name: c3-translator
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      TARGET_LANGUAGE: ${TARGET_LANGUAGE:-French}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: translator-service
      KAFKA_INPUT_TOPIC: dms.documents.uploaded
      KAFKA_OUTPUT_TOPIC: dms.documents.translated
      KAFKA_AUTO_OFFSET_RESET: earliest
      GEMINI_MAX_RETRIES: 5
      GEMINI_RETRY_BACKOFF_SECONDS: 10
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  c3_minio_data:
