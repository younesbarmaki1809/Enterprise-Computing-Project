server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      server:
        webmvc:
          routes:
            - id: documents
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/documents/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: users
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: categories
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/categories/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: departments
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/departments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: versions
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/versions/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: comments
              uri: ${COMMENTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/comments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}