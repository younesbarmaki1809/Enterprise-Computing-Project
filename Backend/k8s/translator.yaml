apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator-service
  template:
    metadata:
      labels:
        app: translator-service
    spec:
      containers:
        - name: translator-service
          image: translator-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
