apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comments-service
  template:
    metadata:
      labels:
        app: comments-service
    spec:
      initContainers:
        - name: wait-cassandra
          image: cassandra:4.1.4
          command:
            - bash
            - -c
            - |
              echo "Waiting for Cassandra to be ready..."
              until cqlsh cassandra 9042 -e "DESCRIBE CLUSTER" > /dev/null 2>&1; do
                echo "Cassandra not ready, retrying in 5s..."
                sleep 5
              done
              echo "Creating keyspace dms..."
              cqlsh cassandra 9042 -e "
                CREATE KEYSPACE IF NOT EXISTS dms
                WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
              "
              echo "Keyspace dms ready."
      containers:
        - name: comments-service
          image: comments-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: CASSANDRA_HOST
              value: cassandra
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: comments
spec:
  selector:
    app: comments-service
  ports:
    - port: 8083
      targetPort: 8083
