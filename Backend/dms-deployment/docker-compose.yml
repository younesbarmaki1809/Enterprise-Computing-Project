version: "3.9"

services:
  documents:
    image: dms-documents
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      COMMENTS_SERVICE_URL: http://comments:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_ENABLED: "true"
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: http://minio:9000
      AWS_S3_ACCESS_KEY: admin
      AWS_S3_SECRET_KEY: ensia1234
      AWS_S3_BUCKET: documents
    depends_on:
      - redis
      - comments
      - kafka
      - minio

  comments:
    image: dms-comments
    ports:
      - "8083:8083"
    environment:
      CASSANDRA_HOST: cassandra
    depends_on:
      - cassandra

  gateway:
    image: dms-gateway
    ports:
      - "8080:8080"

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ensia1234
    volumes:
      - minio_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: dms-cluster
      CASSANDRA_DC: datacenter1
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      retries: 10

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: authdb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authuser", "-d", "authdb"]
      interval: 10s
      retries: 5

volumes:
  minio_data: